<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Make Aim</title>
<link rel="stylesheet" href="Form.css">

<style>
/* ══════ NÚT NHẠC ══════ */
.music-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;
  background:rgba(167,139,250,.15);
  border:1px solid rgba(167,139,250,.35);
  color:#c4b5fd;font-size:16px;line-height:1;
  cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;
  flex:0 0 auto;
}
.music-btn:hover{background:rgba(167,139,250,.3);transform:scale(1.06)}
.music-btn.playing{
  color:#fbbf24;border-color:rgba(251,191,36,.55);
  background:rgba(251,191,36,.15);
  animation:pulseMusic 1.6s ease-in-out infinite;
}
@keyframes pulseMusic{
  0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.45)}
  50%    {box-shadow:0 0 0 9px rgba(251,191,36,0)}
}
#musicBtnGate{
  position:absolute;top:14px;left:14px;
  width:36px;height:36px;font-size:15px;z-index:10;
}

/* ══════ ẢNH BÊN CẠNH 🎯 / 👤 ══════ */
.img-beside{
  display:inline-flex;align-items:center;justify-content:center;
  width:32px;height:32px;flex:0 0 auto;
  border-radius:50%;
  overflow:hidden;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(167,139,250,.35);
  box-shadow:0 0 10px rgba(167,139,250,.25);
  transition:transform .2s, box-shadow .2s;
}
.img-beside:hover{
  transform:scale(1.08);
  box-shadow:0 0 14px rgba(167,139,250,.55);
}
.img-beside img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.img-beside::after{ /* fallback emoji nếu ảnh lỗi */
  content:attr(data-fb);
  font-size:15px;line-height:1;
  position:absolute;display:none;
}
.img-beside.broken::after{display:block}
.img-beside.broken img{display:none}

/* Vị trí ảnh trong popup key (ngay bên phải logo 🎯) */
#ffGateModal .gate-logo{position:relative}
#ffGateModal .img-beside.gate-img{
  position:absolute;
  right:-44px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;
}
</style>
</head>
<body>

<audio id="bgMusic" loop preload="none">
  <source src="nhac-nen.mp3" type="audio/mpeg">
</audio>

<canvas id="web-canvas"></canvas>
<div class="bg-glow" aria-hidden="true">
  <div class="bg-glow-1"></div><div class="bg-glow-2"></div><div class="bg-glow-3"></div>
</div>

<!-- ══════ HEADER ══════ -->
<header id="hd"><div class="bar">
  <button class="ib" onclick="dr(1)" id="mb"></button>
  <div class="logo" onclick="go('home')" id="lg"></div>
  <button class="ib g" onclick="goSearch()" id="sb"></button>

  <!-- 🔊 nút nhạc -->
  <button class="music-btn" onclick="toggleMusic()" id="musicBtnHeader" title="Bật/Tắt nhạc">🔇</button>

  <!-- 🖼 ẢNH NGAY BÊN 👤 -->
  <span class="img-beside" data-fb="✨" title="Avatar">
    <img src="tun-tun.JPG" alt="Ảnh"
         onerror="this.parentNode.classList.add('broken');this.style.display='none'">
  </span>

  <!-- 👤 avatar -->
  <button class="upill" id="uBtn" onclick="um()">
    <img src="tun-tun.JPG" alt="Ảnh"
         onerror="this.style.display='none';this.parentNode.innerHTML='👤'">
  </button>
</div><div class="um" id="um"></div></header>

<main id="app" class="wrap"></main>
<div class="ov" id="dOv" onclick="if(event.target===this)dr(0)"><aside class="drawer" id="drw"></aside></div>
<div class="ov" id="mOv" onclick="if(event.target===this)modal(0)"><div class="modal" id="md"></div></div>
<div class="toast" id="toast"></div>

<!-- ══════ POPUP KEY ══════ -->
<div id="ffGateModal">
  <div class="gate-box" style="position:relative">

    <button class="gate-close" onclick="ffCloseGate()">✕</button>
    <button class="music-btn" onclick="toggleMusic()" id="musicBtnGate" title="Bật/Tắt nhạc">🔇</button>

    <div class="gate-logo">
      <!-- 🎯 logo -->
      <img src="nen-tun.jpg.JPG" alt="Ảnh"
           onerror="this.style.display='none';this.parentNode.innerHTML='🎯'">

      <!-- 🖼 ẢNH NGAY BÊN 🎯 -->
      <span class="img-beside gate-img" data-fb="⭐" title="Badge">
        <img src="anh-badge.png" alt="Ảnh"
             onerror="this.parentNode.classList.add('broken');this.style.display='none'">
      </span>
    </div>

    <div class="gate-title">FF TOOL</div>
    <div class="gate-sub">Nhập Key để mở khoá</div>
    <input type="text" id="ffGateInput" class="gate-input"
           placeholder="FFVIP-XXX-XXX-XXX"
           spellcheck="false" autocomplete="off" autocapitalize="characters">
    <button type="button" class="gate-btn" onclick="ffSubmitGate()">XÁC NHẬN</button>
    <div id="ffGateMsg" class="gate-msg"></div>
  </div>
</div>

<!-- ══════ PHẦN CÒN LẠI GIỮ NGUYÊN (ffToolOverlay…) ══════ -->

<script src="Local.js" defer></script>
<script>
/* ══════ LOGIC NHẠC ══════ */
(function(){
  var audio = document.getElementById('bgMusic');
  if (!audio) return;
  function syncBtn(){
    var playing = !audio.paused && !audio.ended;
    document.querySelectorAll('.music-btn').forEach(function(b){
      b.textContent = playing ? '🔊' : '🔇';
      b.classList.toggle('playing', playing);
      b.title = playing ? 'Tắt nhạc' : 'Bật nhạc';
    });
  }
  window.toggleMusic = function(){
    if (audio.paused){
      audio.play().then(syncBtn).catch(function(err){
        console.warn('[Music]', err);
        if (window.toast) toast('Không tìm thấy file music.mp3');
      });
    } else { audio.pause(); syncBtn(); }
  };
  audio.addEventListener('play', syncBtn);
  audio.addEventListener('pause', syncBtn);
  audio.addEventListener('ended', syncBtn);
  syncBtn();
})();
</script>
</body></html>
